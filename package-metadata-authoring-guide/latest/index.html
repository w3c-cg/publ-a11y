<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<script>
		    let latestVersion = "https://w3c-cg.github.io/publ-a11y/package-metadata-authoring-guide/";
    		window.location = latestVersion + window.location.hash;
		</script>
		<title>Latest version</title>
	</head>
	<body>
		<p>Latest version is at <a id="latestLink"></a>.</p>
		<script>
			var ll = document.getElementById('latestLink');
				ll.href = ll.innerHTML = latestVersion;
		</script>
	</body>
</html>
